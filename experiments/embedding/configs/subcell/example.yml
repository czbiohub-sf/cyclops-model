# Example SubCell feature-extraction config (1536 features per cell).
#
# Run from the monorepo root:
#   uv run python cyclops_model/src/cyclops_model/models/subcell.py \
#       --config_path cyclops_model/experiments/embedding/configs/subcell/example.yml
#
# Paths may reference environment variables ($OPS_BASE_PATH below). They are
# expanded when the config is loaded; an unset variable is an error rather than a
# literal directory of that name.

model_type: subcell
dataset_type: basic

data_manager:
  experiments:
    ops0031_20250424:
      - A/1/0
      - A/2/0
      - A/3/0
  dna_channel: DAPI       # nuclear channel — Blue input to the SubCell bg model
  batch_size: 32          # SubCell runs at 448x448 internally; tune up if GPU allows
  data_split:
    - 0
    - 0
    - 1
  out_channels:           # each protein channel is paired with dna_channel,
    - Phase2D             # one SLURM job per pair
    - GFP
  initial_yx_patch_size:
    - 256
    - 256
  final_yx_patch_size:
    - 128
    - 128
  num_workers: 10
  balanced_sampling: False

output_dir: $OPS_BASE_PATH/ops0031_20250424/3-assembly/subcell_features
cell_type: 'A549'

aggregation:
  guide_level:
    compute_embeddings: false
  gene_level:
    compute_embeddings: false

batch_processing:
  force_reprocess: true

slurm:
  partition: gpu
  gres: gpu:1
  cpus_per_task: 10
  mem: 36G
  time: '4:00:00'
  constraint: h100|h200|a100|a40
